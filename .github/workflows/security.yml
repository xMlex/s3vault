name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  govulncheck:
    # govulncheck отличается от generic-CVE-сканеров: он отвечает на вопрос
    # «вызывается ли уязвимый код именно этим проектом», а не «есть ли такой
    # CVE в графе зависимостей». Для S3/крипто-утилиты это и есть нужный гейт.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        check-latest: true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

    - name: Run govulncheck
      run: govulncheck ./...

  gosec:
    # Полный прогон остаётся видимым счётчиком долга, но не гейтом. Standalone
    # gosec не понимает //nolint:gosec (в отличие от golangci-lint), поэтому на
    # дереве с осознанными G115/G302/G501 он всегда красный. Новые находки
    # гейтит lint.yml: gosec включён в .golangci.yml и only-new-issues.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        check-latest: true

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run gosec (informational)
      run: |
        set +e
        gosec -quiet -fmt=golangci-lint ./...
        rc=$?
        if [ "$rc" -ne 0 ]; then
          echo "::warning title=gosec::known full-tree debt; new findings gate through lint.yml"
        fi
        exit 0
