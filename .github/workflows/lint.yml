name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # only-new-issues считает диф по базе ветки — нужен полный git.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        check-latest: true

    # --new-from-rev вместо only-new-issues: тот берёт диф через GitHub API, а
    # API отдаёт 406 на диф больше 20000 строк и action откатывается к полному
    # прогону — на дереве с сотнями предсуществующих wsl_v5-находок это красный
    # джоб. Сравнение с базовым SHA идёт по локальной истории (fetch-depth: 0) и
    # от размера PR не зависит. Для PR база — base.sha, для push в main —
    # предыдущий коммит ветки.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Версия закреплена: :latest ломает воспроизводимость гейта между
        # прогонами (конфиг version: "2" рассчитан на v2.x).
        version: v2.15.0
        args: --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before }}
