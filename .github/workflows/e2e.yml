name: E2E

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Ручной прогон из вкладки Actions: полный e2e долгий, и гонять его на
  # каждой правке ветки не всегда нужно.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  e2e:
    runs-on: ubuntu-latest
    # Фаза resilience рвёт TCP-прокси и ждёт восстановления — на 10 минут
    # GitHub сам процесс не убьёт, но подстраховаться дешевле, чем red-стабильный
    # джоб из-за потолка.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: s3vault
          POSTGRES_PASSWORD: s3vaulttest
          POSTGRES_DB: s3vault
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U s3vault -d s3vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        check-latest: true

    - name: Start MinIO
      # Service container не умеет передать command, а образу MinIO он нужен
      # (`server /data`). MinIO убрал образы с Docker Hub, поэтому берём
      # публичную сборку Chainguard, закреплённую по digest.
      run: |
        docker run -d --name minio --user 0:0 \
          -p 9000:9000 -p 9001:9001 \
          -e MINIO_ROOT_USER=s3vault \
          -e MINIO_ROOT_PASSWORD=s3vaulttest \
          -e MC_CONFIG_DIR=/tmp/.mc \
          cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d \
          server /data --console-address ":9001"
        for _ in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        docker logs minio
        exit 1

    - name: Install socat
      # Фаза resilience имитирует отказ S3 управляемым socat-прокси, а не
      # docker compose stop — в CI compose вообще не поднимается.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends socat postgresql-client
        socat -V | head -1
        pg_isready --version

    - name: Ensure aws cli
      # scripts/e2e.sh ходит в MinIO напрямую через awscli (s3api get-object и
      # т.д.), мимо s3vault — без него фазы не пройдут.
      run: |
        if ! command -v aws >/dev/null 2>&1; then
          sudo pipx install awscli
        fi
        aws --version

    - name: Create bucket
      # e2e.sh бакет не создаёт: в compose это делает minio-init, здесь —
      # внешний инструмент, тот же приём.
      run: |
        aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket \
          --bucket s3vault || true
        aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket \
          --bucket s3vault
      env:
        AWS_ACCESS_KEY_ID: s3vault
        AWS_SECRET_ACCESS_KEY: s3vaulttest
        AWS_DEFAULT_REGION: us-east-1

    - name: Run e2e
      # S3VAULT_E2E_NO_COMPOSE=1 — MinIO уже поднят шагом Start MinIO выше.
      run: ./scripts/e2e.sh all
      env:
        S3VAULT_E2E_NO_COMPOSE: '1'
        S3VAULT_E2E_PG_PORT: '5432'
        S3VAULT_E2E_PG_USER: s3vault
        S3VAULT_E2E_PG_PASSWORD: s3vaulttest
        S3VAULT_E2E_PG_DB: s3vault

    - name: Run decrypt-detection verify
      # Стенды детектора шифрования (docs/decrypt-detection.md): ветвление
      # DecryptAuto по hdr.Enc, владение слоями, дрейф encryption.mode.
      # Живут отдельно от e2e.sh, потому что проверяют не сценарии CLI, а
      # инварианты чтения, и каждый стенд сам собирает бинарь из исходников.
      run: make verify
      env:
        AWS_ACCESS_KEY_ID: s3vault
        AWS_SECRET_ACCESS_KEY: s3vaulttest
        AWS_DEFAULT_REGION: us-east-1

    - name: Upload vault log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-logs
        path: /tmp/s3vault-e2e-$(id -u)/
        if-no-files-found: ignore

    - name: MinIO log on failure
      if: failure()
      run: docker logs minio || true

    - name: Upload verify logs on failure
      # Причина отказа фасада пишется в srv-<сценарий>-<mode>.log: клиенту
      # уходит пустой InternalError, поэтому без этого артефакта диагностика
      # в CI невозможна. Пути — дефолтные VERIFY_WORKDIR стендов.
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: verify-logs
        path: |
          /tmp/verify/
          /tmp/verify-layers/
          /tmp/verify-drift/
        if-no-files-found: ignore
