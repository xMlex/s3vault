name: Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  s3:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: s3vault
          POSTGRES_PASSWORD: s3vaulttest
          POSTGRES_DB: s3vault
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U s3vault -d s3vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      S3VAULT_S3_ENDPOINT: http://127.0.0.1:9000
      S3VAULT_S3_BUCKET: s3vault-ci
      S3VAULT_S3_REGION: us-east-1
      S3VAULT_S3_PATH_STYLE: 'true'
      S3VAULT_S3_ACCESS_KEY: s3vault
      S3VAULT_S3_SECRET_KEY: s3vaulttest
      S3VAULT_S3_PREFIX: it/
      S3VAULT_LOG_LEVEL: error
      S3VAULT_TEST_POSTGRES_DSN: postgres://s3vault:s3vaulttest@127.0.0.1:5432/s3vault?sslmode=disable
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        check-latest: true

    - name: Start MinIO
      # Service container не умеет передать command, а образу MinIO он нужен
      # (`server /data`). MinIO убрал образы с Docker Hub, поэтому берём
      # публичную сборку Chainguard, закреплённую по digest.
      run: |
        docker run -d --name minio --user 0:0 \
          -p 9000:9000 -p 9001:9001 \
          -e MINIO_ROOT_USER=s3vault \
          -e MINIO_ROOT_PASSWORD=s3vaulttest \
          -e MC_CONFIG_DIR=/tmp/.mc \
          cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d \
          server /data --console-address ":9001"
        for _ in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        docker logs minio
        exit 1

    - name: Ensure aws cli
      # На ubuntu-latest он есть, но полагаться на образ раннера в 2026+ рискованно.
      run: |
        if ! command -v aws >/dev/null 2>&1; then
          sudo pipx install awscli
        fi
        aws --version

    - name: Create bucket
      # Код CreateBucket не вызывает (см. AGENTS.md) — бакет поднимает внешний
      # инструмент, как это делает minio-init в compose.e2e.yaml.
      # awscli, а не mc: alias mc живёт в ~/.mc контейнера и не переживает
      # следующий docker run.
      run: |
        aws --endpoint-url "$S3VAULT_S3_ENDPOINT" s3api create-bucket \
          --bucket "$S3VAULT_S3_BUCKET" || true
        aws --endpoint-url "$S3VAULT_S3_ENDPOINT" s3api head-bucket \
          --bucket "$S3VAULT_S3_BUCKET"
      env:
        AWS_ACCESS_KEY_ID: s3vault
        AWS_SECRET_ACCESS_KEY: s3vaulttest
        AWS_DEFAULT_REGION: us-east-1

    - name: Integration tests
      # -count=1 обязателен: закэшированный результат скрывает плавающие
      # взаимодействия с сервисом. Без S3VAULT_* тесты просто t.Skip.
      run: go test -tags=integration -race -count=1 -v ./internal/integration/

    - name: PostgreSQL auth integration
      # Схема, секреты, prefix-инварианты и запросы фасада против живой БД.
      run: go test -tags=integration -race -count=1 -p 1 -v ./internal/adapter/s3auth/postgres ./internal/s3api

    - name: MinIO log on failure
      if: failure()
      run: docker logs minio || true
