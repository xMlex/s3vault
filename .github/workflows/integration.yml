name: Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  s3:
    runs-on: ubuntu-latest
    services:
      minio:
        # Пин на релизный тег, не :latest — иначе зелёный/красный результат
        # зависит от того, что попало в реестр в день запуска.
        image: minio/minio:RELEASE.2025-10-15T17-29-55Z
        env:
          MINIO_ROOT_USER: s3vault
          MINIO_ROOT_PASSWORD: s3vaulttest
        ports:
          - '9000:9000'
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      S3VAULT_S3_ENDPOINT: http://127.0.0.1:9000
      S3VAULT_S3_BUCKET: s3vault-ci
      S3VAULT_S3_REGION: us-east-1
      S3VAULT_S3_PATH_STYLE: 'true'
      S3VAULT_S3_ACCESS_KEY: s3vault
      S3VAULT_S3_SECRET_KEY: s3vaulttest
      S3VAULT_S3_PREFIX: it/
      S3VAULT_LOG_LEVEL: error
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        check-latest: true

    - name: Ensure aws cli
      # На ubuntu-latest он есть, но полагаться на образ раннера в 2026+ рискованно.
      run: |
        if ! command -v aws >/dev/null 2>&1; then
          sudo pipx install awscli
        fi
        aws --version

    - name: Create bucket
      # Код CreateBucket не вызывает (см. AGENTS.md) — бакет поднимает внешний
      # инструмент, как это делает minio-init в compose.e2e.yaml.
      # awscli, а не mc: alias mc живёт в ~/.mc контейнера и не переживает
      # следующий docker run.
      run: |
        aws --endpoint-url "$S3VAULT_S3_ENDPOINT" s3api create-bucket \
          --bucket "$S3VAULT_S3_BUCKET" || true
        aws --endpoint-url "$S3VAULT_S3_ENDPOINT" s3api head-bucket \
          --bucket "$S3VAULT_S3_BUCKET"
      env:
        AWS_ACCESS_KEY_ID: s3vault
        AWS_SECRET_ACCESS_KEY: s3vaulttest
        AWS_DEFAULT_REGION: us-east-1

    - name: Integration tests
      # -count=1 обязателен: закэшированный результат скрывает плавающие
      # взаимодействия с сервисом. Без S3VAULT_* тесты просто t.Skip.
      run: go test -tags=integration -race -count=1 -v ./internal/integration/
