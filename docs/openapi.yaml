openapi: 3.0.3
info:
  title: s3vault HTTP API
  version: "2.0"
  description: |
    Operational HTTP surface of `s3vault server` (the gateway).

    The gateway serves object data **only** over its S3 API facade (SigV4,
    path-style) — see `architecture.md`. The former bearer-token `HTTP /files`
    frontend (`GET`/`HEAD`/`PUT`) and the `remote.url` ingest mode were removed:
    a client without CryptoPro/S3 points `s3.endpoint` at the gateway facade
    and uses the gateway's `server.s3_access_key`/`server.s3_secret_key`.

    This document covers the remaining plain HTTP endpoints only: liveness and
    readiness. Prometheus metrics are on a separate listen
    (`server.metrics_listen`, default `127.0.0.1:9090`).
  contact:
    name: xMlex/s3vault
    url: https://github.com/xMlex/s3vault

servers:
  - url: http://127.0.0.1:8080
    description: Gateway operational endpoints (default)
  - url: http://127.0.0.1:9090
    description: Metrics server only (`/metrics`)

tags:
  - name: health
    description: Liveness and readiness (no body schema)

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Process is alive. Never touches the object store.
      operationId: getHealth
      responses:
        "200":
          description: Alive
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: Cheap HEAD against the object store.
      operationId: getReady
      responses:
        "200":
          description: Store reachable
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "503":
          description: Store unreachable
