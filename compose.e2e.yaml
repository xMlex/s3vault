name: s3vault-e2e

# E2E-стенд: только S3-совместимое хранилище. Остальное (HTTP-сервер,
# S3-фасад, метрики, кэш, ключи) — это порты и каталоги самого s3vault,
# их поднимает scripts/e2e.sh.
#
#   docker compose -f compose.e2e.yaml up -d
#   docker compose -f compose.e2e.yaml down -v
#
# Именованный том (не tmpfs) — сценарий resilience останавливает MinIO
# и поднимает заново; на tmpfs данные бы потерялись.

services:
  minio:
    # MinIO больше не публикует образы на Docker Hub; cgr.dev/chainguard/minio
    # собирается из upstream. Digest закреплён вместо тега release, чтобы
    # зелёный/красный результат не зависел от перезаписи тега.
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    # Образ запускается nonroot, а named volume создаётся root-owned. Стенд
    # тестовый, поэтому root внутри контейнера — меньшая цена, чем chown-init.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3VAULT_E2E_S3_ACCESS_KEY:-s3vault}
      MINIO_ROOT_PASSWORD: ${S3VAULT_E2E_S3_SECRET_KEY:-s3vaulttest}
      MC_CONFIG_DIR: /tmp/.mc
    ports:
      - "${S3VAULT_E2E_MINIO_API:-9000}:9000"
      - "${S3VAULT_E2E_MINIO_CONSOLE:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # В образе нет curl, но есть mc; alias local уже настроен на localhost.
      test:
        - CMD-SHELL
        - mc ready local
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # PostgreSQL для фазы пользователей gateway. Пароль — только для стенда.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${S3VAULT_E2E_PG_USER:-s3vault}
      POSTGRES_PASSWORD: ${S3VAULT_E2E_PG_PASSWORD:-s3vaulttest}
      POSTGRES_DB: ${S3VAULT_E2E_PG_DB:-s3vault}
    ports:
      - "${S3VAULT_E2E_PG_PORT:-15432}:5432"
    volumes:
      # postgres:18+ keeps PGDATA under a versioned subdirectory; mounting the
      # parent is what the image requires (the old /data mount refuses to start).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # Создаёт бакет и выходит. s3store.New только проверяет, что имя бакета
  # непустое, и ни разу не вызывает CreateBucket — бакет обязан существовать.
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3VAULT_E2E_S3_ACCESS_KEY:-s3vault}
      MINIO_ROOT_PASSWORD: ${S3VAULT_E2E_S3_SECRET_KEY:-s3vaulttest}
      S3VAULT_E2E_S3_BUCKET: ${S3VAULT_E2E_S3_BUCKET:-s3vault}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set vault http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "vault/$$S3VAULT_E2E_S3_BUCKET" >/dev/null
        mc anonymous set none "vault/$$S3VAULT_E2E_S3_BUCKET" >/dev/null 2>&1 || true
        echo "bucket $$S3VAULT_E2E_S3_BUCKET ready"
    restart: "no"

volumes:
  minio-data:
  postgres-data:
