log:
  level: info
backend:
  type: s3  # s3 | local
  # local:
  #   dir: /srv/s3vault/objects  # object tree on this host; s3.* is then unused
  # Env equivalents (override this file, no YAML needed at all):
  #   S3VAULT_BACKEND_TYPE=local
  #   S3VAULT_BACKEND_LOCAL_DIR=/srv/s3vault/objects
  # Форма объекта задаётся только encryption.mode, на любом бэкенде:
  #   none    — голый payload, без контейнера S3VCTR01 (читается как обычный файл)
  #   native  — S3VCTR01(enc=native)  || S3VLT01…
  #   command — S3VCTR01(enc=command) || шифротекст
  # Ключа backend.local.layout больше нет: он выражал то же свойство, но только
  # для одного бэкенда, из-за чего у archive было два разных пути записи.
s3:
  region: us-east-1
  bucket: my-bucket
  prefix: backups
  path_style: false
  # session_token: ""  # only for STS-style temporary credentials
  # allow_secrets_in_config: false  # set true to silence the secret-in-YAML warning
  # Схема endpoint определяет TLS сама: https:// — с проверкой сертификата
  # по системному хранилищу, http:// — без TLS. Отдельного ключа s3.tls нет:
  # два источника истины для одного факта молча расходятся.
  # Размер одной multipart-части, в байтах. Это выбор писателя, а не переговоры:
  # столько клиент и отправляет, и любое S3-совместимое хранилище — включая
  # фасад шлюза — примет любой допустимый размер. Границы задаёт сам S3: не
  # меньше 5242880 (5 МиБ) для всех частей, кроме последней, и не больше
  # 5368709120 (5 ГиБ). Тело не больше одной части уходит одиночным PutObject
  # и сессию не открывает, так что это значение же — порог начала multipart.
  # Плюс: меньше круговых походов. Минус: память — SDK держит concurrency+1
  # буферов ровно по этому размеру: дефолт 5 МиБ — это примерно 30 МиБ в
  # полёте при concurrency 5, и каждый добавленный МиБ стоит ещё ~5 МиБ там.
  # Части крупнее — меньше круговых походов; поднимайте, только если есть
  # куда девать память.
  # 0 = не задано, берётся дефолт; любое другое значение вне диапазона
  # отвергается на старте.
  # multipart_part_size: 5242880
encryption:
  mode: none
  # native: S3VLT01 inside S3VCTR01. RSA is envelope-only — it never touches file bytes.
  # mode: native
  # native:
  #   wrap: rsa-oaep          # rsa-oaep | keyfile
  #   public_key_path: /etc/s3vault/public.pem
  #   private_key_path: /etc/s3vault/private.pem   # wrap: rsa-oaep
  #   key_file: /etc/s3vault/kek.bin              # wrap: keyfile; 32 raw bytes or SHA-256 of the file
  #   chunk_size: 65536
  # CryptoPro CSP (ГОСТ): provider + SHA-1 thumbprint → S3VCTR01 header;
  # download uses header (CRYPTOPRO_THUMBPRINT) so old objects stay decryptable after key rotation.
  # PIN — only CRYPTOPRO_PIN in the process environment, not in this file.
  # mode: command
  # command:
  #   provider: cryptopro
  #   thumbprint: "afa43c43975fbfc700f051fd62016e1571e7e025"
  #   encrypt: ["/usr/local/libexec/s3vault/cryptcp-encrypt"]
  #   decrypt: ["/usr/local/libexec/s3vault/cryptcp-decrypt"]
  #   timeout: 30m
cache:
  enabled: false  # true = persistent plaintext disk cache for HTTP/S3
  # dir: /var/cache/s3vault
  ttl: 168h
  soft_ttl: 20s  # serve hits without S3 HEAD; then stale-while-revalidate
  sweep_interval: 15m  # drop hard-TTL expired entries; 0 = disable
  max_bytes: 10737418240
server:
  listen: "127.0.0.1:8080"
  metrics_listen: "127.0.0.1:9090"
  # The gateway serves clients only over the S3 API; server.token / HTTP /files
  # were removed. A non-loopback or loopback server both require the S3 keys.
  # S3 API (SigV4 plaintext facade). Both keys required (the only data frontend).
  # s3_listen: ""  # empty = multiplex on listen (reserved: /health /ready)
  # s3_listen: "127.0.0.1:8333"  # or separate port; needs the key pair below
  # s3_access_key / s3_secret_key: prefer S3VAULT_SERVER_S3_ACCESS_KEY / S3VAULT_SERVER_S3_SECRET_KEY
  # s3_region: us-east-1
  # s3_bucket: my-bucket  # virtual bucket name; default = s3.bucket
  # s3_bucket_as_prefix: false  # true = client bucket name becomes key prefix under s3.bucket
  # Multipart. Клиент сам решает, когда нужен multipart и какого размера его
  # части (см. s3.multipart_part_size выше), а шлюз собирает присланное сам:
  # отдельного ключа «layout» нет, клиент о шлюзе не знает.
  # Каталог спула НЕ переиспользует cache.dir: у кэша свои инварианты (TTL, сборщик,
  # блокировки) и он по умолчанию выключен, а multipart обязан работать всегда.
  # В спуле лежит plaintext (как и в кэше) — держите его на локальном диске с запасом
  # по месту: на пике сборки там примерно удвоенный объём объекта.
  # multipart_dir: /var/cache/s3vault/multipart
  # multipart_ttl: 24h                 # сессия без UploadPart столько живёт
  # multipart_sweep_interval: 15m      # как часто сборщик чистит спул; 0 = выключить
  # multipart_max_sessions: 64         # больше живых сессий — вытесняется самая старая
  # multipart_max_bytes: 0             # лимит байт на одну сессию; 0 = без ограничения
# Клиент без CryptoPro/S3: указывает s3.endpoint на S3-фасад шлюза и использует
# его server.s3_access_key/server.s3_secret_key как S3-креды, path_style: true.
# Тогда archive/upload/download ходят только через шлюз. Ключи remote.url и
# S3VAULT_SERVER_TOKEN удалены.
archive:
  older_than: 7d
  workers: 4
  follow_symlinks: false
  # fail_fast: false      # one file error aborts the whole run
  # delete_after_upload: false
  # delete_if_exists: false
