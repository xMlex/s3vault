log:
  level: info
backend:
  type: s3  # s3 | local
  # local:
  #   dir: /srv/s3vault/objects  # object tree on this host; s3.* is then unused
  #   layout: container          # default: S3VCTR01 || payload (S3 parity)
  #   # layout: raw              # plaintext as-is (encryption.mode=none only)
  # Env equivalents (override this file, no YAML needed at all):
  #   S3VAULT_BACKEND_TYPE=local
  #   S3VAULT_BACKEND_LOCAL_DIR=/srv/s3vault/objects
  #   S3VAULT_BACKEND_LOCAL_LAYOUT=raw
s3:
  region: us-east-1
  bucket: my-bucket
  prefix: backups
  path_style: false
  tls: true
encryption:
  mode: none
  # CryptoPro CSP (ГОСТ): provider + SHA-1 thumbprint → S3VCTR01 header;
  # download uses header (CRYPTOPRO_THUMBPRINT) so old objects stay decryptable after key rotation.
  # PIN — only CRYPTOPRO_PIN in the process environment, not in this file.
  # mode: command
  # command:
  #   provider: cryptopro
  #   thumbprint: "afa43c43975fbfc700f051fd62016e1571e7e025"
  #   encrypt: ["/usr/local/libexec/s3vault/cryptcp-encrypt"]
  #   decrypt: ["/usr/local/libexec/s3vault/cryptcp-decrypt"]
  #   timeout: 30m
cache:
  enabled: false  # true = persistent plaintext disk cache for HTTP/S3
  # dir: /var/cache/s3vault
  ttl: 168h
  soft_ttl: 20s  # serve hits without S3 HEAD; then stale-while-revalidate
  sweep_interval: 15m  # drop hard-TTL expired entries; 0 = disable
  max_bytes: 10737418240
server:
  listen: "127.0.0.1:8080"
  metrics_listen: "127.0.0.1:9090"
  # token: set via S3VAULT_SERVER_TOKEN, not in this file.
  # Required once listen is not loopback (e.g. 0.0.0.0:8080), unless the S3 API
  # keys below are set; otherwise the server refuses to start.
  # S3 API (SigV4 plaintext facade). Both keys required to enable.
  # s3_listen: ""  # empty = multiplex on listen (reserved: /health /ready /files)
  # s3_listen: "127.0.0.1:8333"  # or separate port; needs the key pair below
  # s3_access_key / s3_secret_key: prefer S3VAULT_SERVER_S3_ACCESS_KEY / S3VAULT_SERVER_S3_SECRET_KEY
  # s3_region: us-east-1
  # s3_bucket: my-bucket  # virtual bucket name; default = s3.bucket
  # s3_bucket_as_prefix: false  # true = client bucket name becomes key prefix under s3.bucket
# Client without CryptoPro/S3: send plaintext to a configured s3vault server.
# remote:
#   url: "https://s3vault.example:8080"
#   rate_limit_bps: 10485760  # 10 MiB/s aggregate; 0 = unlimited
# Auth: same S3VAULT_SERVER_TOKEN as the server.
archive:
  older_than: 7d
  workers: 4
  on_change: overwrite
  follow_symlinks: false
  # delete_after_upload: false
  # delete_if_exists: false
